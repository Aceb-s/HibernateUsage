server:
  port: 8761

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    hostname: localhost

  server:
    enable-self-preservation: false
    wait-time-in-ms-when-sync-empty: 0

spring:
  application:
    name: eureka-server
