spring:
  cloud:
    config:
      enabled: false
  
  datasource:
    url: jdbc:postgresql://postgres:5432/userdb
    username: postgres      # <-- Исправлено
    password: "1"           # <-- Исправлено
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/

instance:
  hostname: user-service
